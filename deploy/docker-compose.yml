name: smart-inbox
services:
  backend:
    build: ../backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/mail.db
    volumes:
      - data:/data          # your database lives here and survives restarts/updates
    restart: unless-stopped
    expose: ["8000"]        # only reachable from the web container, never from the internet
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data    # HTTPS certificates
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
volumes:
  data:
  caddy_data:
  caddy_config:
